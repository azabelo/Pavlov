[package]
name = "pavlov"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pavlovd-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
btleplug = "=0.11.8"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
uuid = "1.19.0"
